
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問知 AI｜智慧問答</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#edf2ff;font:16px/1.7 system-ui,sans-serif}
header{padding:18px 5%;border-bottom:1px solid #293650;display:flex;justify-content:space-between;align-items:center}
h1{font-size:21px;margin:0}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 15px;background:#aab4ff;color:#10172a;font-weight:bold}
.secondary{background:#202c46;color:#edf2ff;border:1px solid #35425e}
main{max-width:850px;margin:auto;padding:25px 18px}
.welcome{text-align:center;padding:35px 0}
.welcome h2{font-size:32px}
.muted{color:#a1aec8}
#messages{display:flex;flex-direction:column;gap:20px;margin-bottom:25px}
.message{padding:15px 18px;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#1b2942;margin-left:12%}
.ai{background:#141e33;border:1px solid #293650;margin-right:3%}
.sources{border-top:1px solid #35425e;margin-top:15px;padding-top:10px}
.sources a{display:block;color:#b9c5ff;margin:8px 0;overflow-wrap:anywhere}
.composer{position:sticky;bottom:0;background:#0b1020;padding:12px 0 20px}
textarea,input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #35425e;background:#111a2d;color:white;font:inherit}
textarea{min-height:90px;resize:vertical}
.controls{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:10px}
.notice{font-size:12px;color:#a1aec8;margin-top:15px}
dialog{width:min(500px,92%);border:1px solid #35425e;border-radius:15px;background:#111a2d;color:white;padding:22px}
dialog::backdrop{background:#000b}
label{display:block;margin:14px 0 6px}
@media(max-width:600px){.welcome h2{font-size:26px}.user{margin-left:4%}.ai{margin-right:0}header{padding:15px}}
</style>
</head>
<body>
<header>
  <div><h1>✦ 問知 AI</h1><small class="muted">探索知識，理解世界</small></div>
  <div>
    <button class="secondary" id="settings">AI 設定</button>
    <button class="secondary" id="newChat">新對話</button>
  </div>
</header>

<main>
  <section class="welcome" id="welcome">
    <div style="font-size:38px">✧</div>
    <h2>今天想探索什麼？</h2>
    <p class="muted">提出問題、學習新知、解決難題，或查詢最新資訊。</p>
    <button class="secondary example">用簡單的方式解釋黑洞</button>
    <button class="secondary example">教我理解微積分</button>
  </section>

  <section id="messages" aria-live="polite"></section>

  <section class="composer">
    <textarea id="question" placeholder="輸入任何問題……（Enter 傳送，Shift + Enter 換行）"></textarea>
    <div class="controls">
      <span class="muted" id="status">尚未設定 AI</span>
      <div><button class="secondary" id="stop" hidden>停止</button> <button id="send">傳送 ↑</button></div>
    </div>
    <p class="notice">AI 可能出錯，重要資訊請核對來源。本網站是獨立專案，並非 ChatGPT 官方產品。</p>
  </section>
</main>

<dialog id="settingsDialog">
  <h2>連接 Gemini AI</h2>
  <p class="muted">請使用自己的 Gemini API 金鑰。金鑰只保存在目前頁面的記憶體，不會寫入網站檔案或瀏覽器儲存空間。</p>
  <label for="apiKey">API 金鑰</label>
  <input id="apiKey" type="password" autocomplete="off" placeholder="貼上自己的 API 金鑰">
  <label for="model">模型</label>
  <select id="model">
    <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
    <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
  </select>
  <p id="error" style="color:#ffaaaa"></p>
  <button id="save">開始使用</button>
  <button class="secondary" id="close">取消</button>
</dialog>

<script>
const $=id=>document.getElementById(id);
let apiKey="",model="gemini-2.5-flash",history=[],busy=false,controller=null;

function addMessage(role,text,sources=[]){
  $("welcome").hidden=true;
  const div=document.createElement("div");
  div.className="message "+(role==="user"?"user":"ai");
  // textContent prevents model output from injecting HTML into the page.
  const content=document.createElement("div");
  content.textContent=text;
  div.appendChild(content);

  if(sources.length){
    const box=document.createElement("div");
    box.className="sources";
    const heading=document.createElement("strong");
    heading.textContent="參考來源";
    box.appendChild(heading);
    const seen=new Set();
    for(const source of sources){
      try{
        const url=new URL(source.uri);
        if(!["https:","http:"].includes(url.protocol)||seen.has(url.href))continue;
        seen.add(url.href);
        const a=document.createElement("a");
        a.href=url.href;a.target="_blank";a.rel="noopener noreferrer";
        a.textContent=(source.title||url.hostname)+" — "+url.hostname;
        box.appendChild(a);
      }catch(e){}
    }
    if(seen.size)div.appendChild(box);
  }
  $("messages").appendChild(div);
  div.scrollIntoView({behavior:"smooth",block:"end"});
}

function openSettings(){
  $("apiKey").value="";
  $("error").textContent="";
  $("settingsDialog").showModal();
}
$("settings").onclick=openSettings;
$("close").onclick=()=>$("settingsDialog").close();
$("save").onclick=()=>{
  const key=$("apiKey").value.trim();
  if(!key){$("error").textContent="請輸入 API 金鑰。";return}
  apiKey=key;
  model=$("model").value;
  $("apiKey").value="";
  $("settingsDialog").close();
  $("status").textContent="AI 已設定";
  if(!history.length)addMessage("assistant","設定完成！現在可以開始提問。");
};

async function ask(){
  const question=$("question").value.trim();
  if(!question||busy)return;
  if(!apiKey){openSettings();$("error").textContent="請先設定 API 金鑰。";return}
  $("question").value="";
  addMessage("user",question);
  history.push({role:"user",parts:[{text:question}]});
  busy=true;$("send").disabled=true;$("stop").hidden=false;
  controller=new AbortController();
  const loading=document.createElement("div");
  loading.className="message ai";loading.id="loading";
  loading.textContent="AI 正在思考並查詢資料……";
  $("messages").appendChild(loading);

  try{
    const endpoint="https://generativelanguage.googleapis.com/v1beta/models/"
      +encodeURIComponent(model)+":generateContent";
    const response=await fetch(endpoint,{
      method:"POST",
      headers:{"Content-Type":"application/json","x-goog-api-key":apiKey},
      signal:controller.signal,
      body:JSON.stringify({
        systemInstruction:{parts:[{text:
          "你是一位誠實、仔細、擅長推理的繁體中文 AI 助理。依使用者的語言回答。請清楚解釋問題；數學問題盡可能逐步檢查。需要最新資訊時使用 Google 搜尋工具。不要捏造事實或來源；不確定時請明確說明。"}]},
        contents:history,
        tools:[{google_search:{}}],
        generationConfig:{temperature:0.5,maxOutputTokens:8192}
      })
    });
    const data=await response.json();
    $("loading")?.remove();
    if(!response.ok)throw Error(data.error?.message||"HTTP "+response.status);

    let answer="",sources=[];
    for(const c of data.candidates||[]){
      for(const p of c.content?.parts||[])if(p.text)answer+=p.text;
      for(const item of c.groundingMetadata?.groundingChunks||[]){
        if(item.web?.uri)sources.push({uri:item.web.uri,title:item.web.title||""});
      }
    }
    answer=answer.trim();
    if(!answer)throw Error("AI 沒有傳回答案，請稍後再試。");
    history.push({role:"model",parts:[{text:answer}]});
    addMessage("assistant",answer,sources);
  }catch(e){
    $("loading")?.remove();
    addMessage("assistant",e.name==="AbortError"?"已停止這次請求。":
      "目前無法取得答案。\n\n請檢查網路、API 金鑰、模型是否可用及 API 額度。\n錯誤訊息："+e.message);
    if(history.at(-1)?.role==="user")history.pop();
  }finally{
    busy=false;controller=null;$("send").disabled=false;$("stop").hidden=true;
  }
}
$("send").onclick=ask;
$("stop").onclick=()=>controller?.abort();
$("question").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask()}
});
document.querySelectorAll(".example").forEach(button=>{
  button.onclick=()=>{$("question").value=button.textContent;$("question").focus()}
});
$("newChat").onclick=()=>{
  if(controller)controller.abort();
  history=[];
  $("messages").replaceChildren();
  $("welcome").hidden=false;
  $("question").value="";
};
</script>
</body>
</html>
