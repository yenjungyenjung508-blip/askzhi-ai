
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>問知 AI｜智慧問答</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#edf2ff;font:16px/1.7 system-ui,sans-serif}
header{padding:18px 5%;border-bottom:1px solid #293650;display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:21px;margin:0}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 15px;background:#aab4ff;color:#10172a;font-weight:bold}
.secondary{background:#202c46;color:#edf2ff;border:1px solid #35425e}
main{max-width:850px;margin:auto;padding:25px 18px}
.welcome{text-align:center;padding:35px 0}
.welcome h2{font-size:32px}
.muted{color:#a1aec8}
#messages{display:flex;flex-direction:column;gap:20px;margin-bottom:25px}
.message{padding:15px 18px;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#1b2942;margin-left:12%}
.ai{background:#141e33;border:1px solid #293650;margin-right:3%}
.sources{border-top:1px solid #35425e;margin-top:15px;padding-top:10px}
.sources a{display:block;color:#b9c5ff;margin:8px 0;overflow-wrap:anywhere}
.composer{position:sticky;bottom:0;background:#0b1020;padding:12px 0 20px}
textarea,input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #35425e;background:#111a2d;color:white;font:inherit}
textarea{min-height:90px;resize:vertical}
.controls{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:10px}
.notice{font-size:12px;color:#a1aec8;margin-top:15px}
dialog{width:min(500px,92%);border:1px solid #35425e;border-radius:15px;background:#111a2d;color:white;padding:22px}
dialog::backdrop{background:#000b}
label{display:block;margin:14px 0 6px}
@media(max-width:600px){.welcome h2{font-size:26px}.user{margin-left:4%}.ai{margin-right:0}header{padding:15px 3%}header button{padding:8px;font-size:12px}}
</style>
</head>
<body>
<header>
  <div>
    <h1>✦ 問知 AI</h1>
    <small class="muted">探索知識，理解世界</small>
  </div>
  <div>
    <button class="secondary" id="settings">AI 設定</button>
    <button class="secondary" id="newChat">新對話</button>
  </div>
</header>

<main>
  <section class="welcome" id="welcome">
    <div style="font-size:38px">✧</div>
    <h2>今天想探索什麼？</h2>
    <p class="muted">提出問題、學習新知、解決難題，或查詢最新資訊。</p>
    <p>
      <button class="secondary example">用簡單的方式解釋黑洞</button>
      <button class="secondary example">教我理解微積分</button>
    </p>
  </section>

  <section id="messages" aria-live="polite"></section>

  <section class="composer">
    <textarea id="question" placeholder="輸入任何問題……（Enter 傳送，Shift + Enter 換行）"></textarea>
    <div class="controls">
      <span class="muted" id="status">尚未設定 AI</span>
      <div>
        <button class="secondary" id="stop" hidden>停止</button>
        <button id="send">傳送 ↑</button>
      </div>
    </div>
    <p class="notice">
      AI 可能出錯，重要資訊請核對來源。本網站是獨立專案，並非 ChatGPT 官方產品。
    </p>
  </section>
</main>

<dialog id="settingsDialog">
  <h2>連接 Gemini AI</h2>
  <p class="muted">
    輸入自己的 Gemini API 金鑰。金鑰只保存在目前頁面的記憶體，
    不會寫入網站檔案或瀏覽器儲存空間。
  </p>
  <label for="apiKey">API 金鑰</label>
  <input id="apiKey" type="password" autocomplete="off" placeholder="貼上自己的 API 金鑰">
  <label for="model">模型</label>
  <select id="model">
    <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
  </select>
  <p id="error" style="color:#ffaaaa"></p>
  <button id="save">開始使用</button>
  <button class="secondary" id="close">取消</button>
</dialog>

<script>
const $ = id => document.getElementById(id);

let apiKey = "";
let model = "gemini-3.8-flash";
let previousInteractionId = null;
let busy = false;
let controller = null;

function openSettings() {
  $("apiKey").value = "";
  $("error").textContent = "";
  $("settingsDialog").showModal();
}

$("settings").onclick = openSettings;
$("close").onclick = () => $("settingsDialog").close();

$("save").onclick = () => {
  const key = $("apiKey").value.trim();

  if (!key) {
    $("error").textContent = "請輸入 API 金鑰。";
    return;
  }

  apiKey = key;
  model = $("model").value;
  $("apiKey").value = "";
  $("settingsDialog").close();
  $("status").textContent = "AI 已設定";

  if (!$("messages").children.length) {
    addMessage("ai", "設定完成！現在可以開始提問。");
  }
};

function addMessage(role, text, sources = []) {
  $("welcome").hidden = true;

  const div = document.createElement("div");
  div.className = "message " + (role === "user" ? "user" : "ai");

  // 使用 textContent 顯示 AI 文字，避免把回答當作 HTML 執行。
  const content = document.createElement("div");
  content.textContent = text;
  div.appendChild(content);

  if (sources.length) {
    const box = document.createElement("div");
    box.className = "sources";

    const heading = document.createElement("strong");
    heading.textContent = "參考來源";
    box.appendChild(heading);

    const seen = new Set();

    for (const source of sources) {
      try {
        const url = new URL(source.uri);

        if (!["https:", "http:"].includes(url.protocol)) continue;
        if (seen.has(url.href)) continue;
        seen.add(url.href);

        const a = document.createElement("a");
        a.href = url.href;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = (source.title || url.hostname) + " — " + url.hostname;
        box.appendChild(a);
      } catch (_) {}
    }

    if (seen.size) div.appendChild(box);
  }

  $("messages").appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
}

function extractResponse(data) {
  let answer = "";
  const sources = [];

  // Interactions API 的文字位於 steps 中的 model_output。
  for (const step of data.steps || []) {
    if (step.type !== "model_output") continue;

    for (const item of step.content || []) {
      if (item.type === "text" && item.text) {
        answer += item.text;
      }

      // 某些回應會把網頁引用放在文字區塊的 annotations。
      for (const annotation of item.annotations || []) {
        const citation = annotation.url_citation || annotation;
        const uri = citation.url || citation.uri;

        if (uri) {
          sources.push({
            uri,
            title: citation.title || citation.name || ""
          });
        }
      }
    }
  }

  return { answer: answer.trim(), sources };
}

async function ask() {
  const question = $("question").value.trim();

  if (!question || busy) return;

  if (!apiKey) {
    openSettings();
    $("error").textContent = "請先設定 API 金鑰。";
    return;
  }

  $("question").value = "";
  addMessage("user", question);

  busy = true;
  $("send").disabled = true;
  $("stop").hidden = false;

  controller = new AbortController();

  const loading = document.createElement("div");
  loading.className = "message ai";
  loading.id = "loading";
  loading.textContent = "AI 正在思考並查詢資料……";
  $("messages").appendChild(loading);

  try {
    const endpoint =
      "https://generativelanguage.googleapis.com/v1beta/interactions";

    const body = {
      model: model,
      input: question,
      system_instruction:
        "你是一位誠實、仔細、擅長推理的繁體中文 AI 助理。" +
        "依照使用者的語言回答。清楚解釋問題，並讓答案有條理。" +
        "數學問題盡可能逐步檢查。需要最新資訊時使用 Google 搜尋。" +
        "不要捏造事實、數據或來源；不確定時請明確說明。" +
        "重要資訊請提醒使用者核對。",
      tools: [{ type: "google_search" }],
      store: false
    };

    // 用戶端保存上一次互動 ID，讓 AI 能接續目前對話。
    if (previousInteractionId) {
      body.previous_interaction_id = previousInteractionId;
    }

    const response = await fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-goog-api-key": apiKey
      },
      signal: controller.signal,
      body: JSON.stringify(body)
    });

    const data = await response.json().catch(() => ({}));
    $("loading")?.remove();

    if (!response.ok) {
      throw new Error(data.error?.message || "HTTP " + response.status);
    }

    const result = extractResponse(data);

    if (!result.answer) {
      throw new Error("AI 沒有傳回答案，請稍後再試。");
    }

    // store=false 時不使用伺服器端的 previous_interaction_id。
    // 改用完整歷史紀錄的無狀態模式，見下方注意事項。
    addMessage("ai", result.answer, result.sources);

    if (data.id) {
      previousInteractionId = data.id;
    }

  } catch (e) {
    $("loading")?.remove();

    const message = e.name === "AbortError"
      ? "已停止這次請求。"
      : "目前無法取得答案。\n\n" +
        "請檢查網路、API 金鑰、模型是否可用及 API 額度。\n" +
        "錯誤訊息：" + (e.message || "未知錯誤");

    addMessage("ai", message);
  } finally {
    busy = false;
    controller = null;
    $("send").disabled = false;
    $("stop").hidden = true;
  }
}

$("send").onclick = ask;
$("stop").onclick = () => controller?.abort();

$("question").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    ask();
  }
});

document.querySelectorAll(".example").forEach(button => {
  button.onclick = () => {
    $("question").value = button.textContent;
    $("question").focus();
  };
});

$("newChat").onclick = () => {
  if (controller) controller.abort();

  previousInteractionId = null;
  $("messages").replaceChildren();
  $("welcome").hidden = false;
  $("question").value = "";
};
</script>
</body>
</html>
